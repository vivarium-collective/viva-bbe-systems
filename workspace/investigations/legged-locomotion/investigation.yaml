glossary:
  - {term: "Central pattern generator (CPG)", definition: "A neural circuit that produces a rhythmic motor pattern without needing rhythmic input — here, the evolved CTRNN's self-sustaining cycle."}
  - {term: "Limit cycle", definition: "A closed, attracting loop in a dynamical system's state space — the mathematical form of a stable rhythm."}
  - {term: "Stance / swing", definition: "Stance: foot planted, leg driving the body forward. Swing: foot lifted, leg recovering forward for the next step."}
  - {term: "Duty factor", definition: "The fraction of a stride the foot is on the ground (in stance). ~0.5 means stance and swing take about equal time."}
  - {term: "Stride period", definition: "The number of time-steps between successive foot-plant onsets — the gait's cycle length."}
  - {term: "Proprioception", definition: "The agent's sense of its own leg angle, fed back to the CTRNN so the CPG can be sensory-entrained."}

