glossary:
  - {term: "CTRNN", definition: "Continuous-time recurrent neural network; τ_i ẏ_i = −y_i + Σ_j w_ij σ(y_j+θ_j) + I_i."}
  - {term: "Center-crossing", definition: "Bias set so each neuron's sigmoid is centered given its total input: θ_i = −Σ_j w_ij/2."}
  - {term: "Saddle-node (fold)", definition: "A bifurcation where two equilibria (one stable, one unstable) are created or annihilated."}
  - {term: "Codimension-2", definition: "Structure seen when two parameters vary; here the cusp organising the fold curves."}

