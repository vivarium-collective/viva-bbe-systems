schema_version: 3
name: as-forage-and-survival
investigation: action-switching
title: Forage Both & Outlive a Non-Mover
status: ran
confidence: Accepted
question: 'Does the evolved forager keep both nutrients alive by visiting both resources, and does it
  survive longer than a passive agent?

  '
claim: 'The agent forages both resources in 12 of 16 SPREAD environments (resources 38-65 units apart) and survives ~1505 steps on average vs 854 for a non-mover (~1.8x) — it navigates/searches for the far resource rather than looping a fixed circle.

  '
expected_behavior:
- name: forages-both-and-outlives-nonmover
  observable: forages-both + mean-survival
  condition: committed M2 seed, 16 SPREAD environments (sep 38-65), max_steps 2000
  rationale: 'Forages both resources (eats from each) in >=11/16 spread environments (achieved 12/16: all near+mid, far tier is the frontier); mean survival > 1.5x a non-mover.
    Verified in tests/test_forager_seed.py.

    '
findings:
- summary: Forages both in 12/16 spread environments (sep 38-65; all near+mid, far tier the frontier); mean survival ~1505 vs non-mover 854 (~1.8x).
  detail: 'figures/forage.gif shows the agent shuttling between resources while both nutrient bars are
    sustained; figures/trajectory_nutrients.png shows the spatial loop + nutrient time series.

    '
