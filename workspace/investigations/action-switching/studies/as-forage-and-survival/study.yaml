schema_version: 3
name: as-forage-and-survival
investigation: action-switching
title: Forage Both & Outlive a Non-Mover
status: ran
confidence: Accepted
question: 'Does the evolved forager keep both nutrients alive by visiting both resources, and does it
  survive longer than a passive agent?

  '
claim: 'The agent forages both resources in 15 of 16 varied environments (varied positions + sizes) and survives ~1351 steps on average vs 706 for a non-mover (1.9x, 2000-step horizon).

  '
expected_behavior:
- name: forages-both-and-outlives-nonmover
  observable: forages-both + mean-survival
  condition: committed M2 seed, 16 varied environments, max_steps 2000
  rationale: 'Forages both resources (eats from each) in >=75% of the 16 varied environments (achieved 15/16); mean survival > 1.5x a non-mover.
    Verified in tests/test_forager_seed.py.

    '
findings:
- summary: Forages both in 15/16 varied environments; mean survival ~1351 vs non-mover 706 (1.9x) at the 2000-step horizon.
  detail: 'figures/forage.gif shows the agent shuttling between resources while both nutrient bars are
    sustained; figures/trajectory_nutrients.png shows the spatial loop + nutrient time series.

    '
visualizations:
- name: forage
  chart: ../../figures/forage.gif
  config:
    caption: Video — the agent shuttling between the two resources, with live nutrient bars.
- name: many environments
  chart: ../../figures/forage_multi.gif
  config:
    caption: 'Video — one agent foraging across six different environments (varied resource positions
      + sizes): a general navigation strategy.'
- name: trajectory and nutrients
  chart: ../../figures/trajectory_nutrients.png
  config:
    caption: Spatial path between the resources + the two nutrient levels over time.
- name: evolution
  chart: ../../figures/evolution_curves.png
  config:
    caption: Switching behaviour emerging over evolution (share foraging both climbs over evolution).
- name: evolution progress
  chart: ../../figures/evolution_progress.gif
  config:
    caption: Best agent's trajectory improving across generations.
baseline:
- name: forager-brain
  process: CTRNNProcess
  params:
    size: 9
    center_crossing: true
    motor_indices:
    - 8
    - 7
variants: []
interventions: []
runs: []
