glossary:
  - {term: "Action switching", definition: "Autonomously changing which coordinated action is engaged (here: which resource is foraged) without a higher-level selector."}
  - {term: "Internal/metabolic state", definition: "The agent's two nutrient levels, sensed internally and coupled to the environment via eating."}
  - {term: "Chemosensor stalk", definition: "A sensor projecting 6 units from the body, reading a resource's chemical concentration at its tip."}
  - {term: "Sensorimotor coordination mode", definition: "A transient regime in which a subset of sensors/effectors drives a particular action (approach/eat A, or B)."}

