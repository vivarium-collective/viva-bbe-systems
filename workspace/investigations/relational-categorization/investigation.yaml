glossary:
  - {term: "Relational categorization", definition: "Classifying a stimulus by its relation to another (here: object 2's size relative to object 1), not by any absolute property."}
  - {term: "Working memory", definition: "Holding information briefly for use in an imminent decision — here, object 1's size across the inter-stimulus interval, realized as CTRNN state."}
  - {term: "Inter-stimulus interval (ISI)", definition: "The blank interval between object 1 disappearing and object 2 appearing, during which nothing is sensed, so any retained information is memory."}
  - {term: "Memoryless ceiling", definition: "The best accuracy a policy that reads only the current object (ignoring object 1) can reach on the battery — here ~0.625; beating it requires memory."}
  - {term: "Ray distance-sensor", definition: "A sensor casting a ray that returns the distance to an object it hits; the array of rays gives the object's angular 'shadow', from which size is perceptible."}

