schema_version: 3
name: memory-dynamics
investigation: relational-categorization
title: Object 1 Held in Memory
status: ran
confidence: Accepted
question: |
  Is the first object's size actually held in the CTRNN's state across the
  inter-stimulus interval, when no object is present — i.e. is this real memory?
claim: |
  Yes. During the ISI (object absent), the agent's neural state encodes object
  1's size with correlation 0.88: the trace is set while object 1 falls and
  persists through the blank interval until object 2 arrives. Memory realized as
  CTRNN dynamics, not a stored value.
expected_behavior:
- name: obj1-size-held-in-isi-state
  observable: correlation of ISI neural state with s1 over a size sweep
  condition: committed 8-neuron seed, mid-ISI state, s1 swept over [2,6]
  rationale: |
    The best |correlation| between a neuron's mid-ISI activation and object 1's
    size exceeds 0.80 (achieved 0.88 during the real trial). Since no object is present during the ISI,
    any such correlation IS a held memory. Verified in tests/test_relational_seed.py.
findings:
- summary: ISI neural state correlates 0.88 with object 1's size — object 1 is clearly held in persistent memory across the stimulus-free interval.
  detail: |
    figures/memory_dynamics.png shows the mid-ISI activation rising monotonically
    with s1 (corr 0.88) and the trace persisting flat through the ISI;
    figures/neural_activity.gif shows the memory trace holding across the phase1 |
    ISI | phase2 raster.
visualizations:
- name: memory dynamics
  chart: ../../figures/memory_dynamics.png
  config:
    caption: Object 1's size encoded in neural state (corr 0.88) and held across the inter-stimulus interval — the memory trace.
- name: neural activity
  chart: ../../figures/neural_activity.gif
  config:
    caption: Video — the CTRNN across object 1 | ISI | object 2; the memory trace persists through the blank interval.
- name: behaviour
  chart: ../../figures/relational.gif
  config:
    caption: The held memory in use — the agent acts on object 2 relative to the remembered object 1.
baseline:
- name: relational-cpg
  composite: viva_bbe_systems.composites.relational
  params: {}
